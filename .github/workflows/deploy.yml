name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual "Run workflow"

# Never run two production deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo is on pnpm (packageManager in package.json, pnpm-lock.yaml),
      # so install with pnpm — setup-node's npm cache finds no lockfile here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Same call as `pnpm deploy` locally, minus the build (done above).
      # Needs two repo secrets:
      #   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages: Edit" permission
      #   CLOUDFLARE_ACCOUNT_ID — account id from the Cloudflare dashboard URL
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=imazhar101-dev
